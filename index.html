<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CCR Chauffeur L&amp;D Tracker</title>
<link rel="icon" href="logo.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=202610101000">
</head>
<body>

<!-- Login -->
<section id="login-view" class="login" hidden>
  <form id="login-form" class="login-card" autocomplete="on">
    <img src="logo.webp" alt="ECO Mobility" class="logo logo-lg">
    <div class="brand brand-lg"><span>CCR Chauffeur L&amp;D Tracker</span></div>
    <p class="muted">Sign in with the email and password your admin gave you.</p>
    <label for="login-email">Email</label>
    <input id="login-email" type="email" required autocomplete="username">
    <label for="login-password">Password</label>
    <input id="login-password" type="password" required autocomplete="current-password">
    <button id="login-btn" class="btn btn-primary" type="submit">Sign in</button>
    <p id="login-error" class="form-error" role="alert"></p>
    <button type="button" class="linkbtn" id="forgot-btn">Forgot password?</button>
  </form>
  <form id="reset-form" class="login-card" autocomplete="on" hidden>
    <img src="logo.webp" alt="ECO Mobility" class="logo logo-lg">
    <div class="brand brand-lg"><span>Set a new password</span></div>
    <div id="rs-step1">
      <p class="muted">Enter the email you sign in with. We will email you a 6-digit code.</p>
      <label for="rs-email">Email</label>
      <input id="rs-email" type="email" autocomplete="username">
      <button id="rs-send" class="btn btn-primary" type="button">Email me a code</button>
    </div>
    <div id="rs-step2" hidden>
      <p class="ok-box" id="rs-sent"></p>
      <label for="rs-code">6-digit code</label>
      <input id="rs-code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="123456">
      <label for="rs-pw">New password</label>
      <input id="rs-pw" type="password" autocomplete="new-password" placeholder="at least 6 characters">
      <label for="rs-pw2">New password again</label>
      <input id="rs-pw2" type="password" autocomplete="new-password">
      <button id="rs-save" class="btn btn-primary" type="submit">Set password and sign in</button>
      <button type="button" class="linkbtn" id="rs-resend">Send a new code</button>
    </div>
    <p id="rs-error" class="form-error" role="alert"></p>
    <button type="button" class="linkbtn" id="rs-back">Back to sign in</button>
  </form>
</section>

<!-- App -->
<div id="app-view" hidden>
  <div class="head-wrap">
  <header class="topbar">
    <div class="brand"><button id="home-btn" class="home-btn" type="button" title="Go to Dashboard and refresh" aria-label="Go to Dashboard and refresh"><img src="logo.webp" alt="ECO Mobility" class="logo"><span class="brand-name"><span id="app-name">CCR Chauffeur L&amp;D Tracker</span></span></button><span id="fy-label" class="chip"></span><span id="scope-label" class="chip chip-scope" hidden></span></div>
    <div class="topbar-actions">
      <span id="sync-status" class="sync" title="Data status"></span>
      <button id="refresh-btn" class="btn btn-ghost" type="button">Refresh</button>
      <button id="fbqr-btn" class="btn btn-ghost" type="button" hidden>Feedback QR</button>
      <button id="export-btn" class="btn btn-ghost" type="button">Export Excel</button>
      <button id="account-btn" class="btn btn-ghost" type="button" hidden title="My account: change password, sign out"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span id="me-name"></span></button>
    </div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Sections">
    <button data-view="dashboard" type="button"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Dashboard</span></button>
    <button data-view="locations" type="button"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg><span>Location Card</span></button>
    <button data-view="chauffeurs" type="button"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/></svg><span>Chauffeur Master</span></button>
    <button data-view="feedback" type="button"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/></svg><span>Feedback</span></button>
    <button data-view="add" type="button" class="tab-primary"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span>Add Training</span></button>
    <button data-view="entries" type="button"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg><span>Entries</span></button>
    <button data-view="admin" type="button" id="admin-tab" hidden><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg><span>Admin</span></button>
  </nav>
  <div class="progress" aria-hidden="true"><i></i></div>
  </div>
  <main id="main" class="main"><div class="loading">Loading training data…</div></main>
</div>

<!-- Drawer / modal -->
<div id="overlay" class="overlay" hidden></div>
<aside id="drawer" class="drawer" hidden aria-modal="true" role="dialog"></aside>
<div id="toast" class="toast" role="status" hidden></div>

<script src="config.js?v=202610101000"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="app.js?v=202610241200"></script>
</body>
</html>
