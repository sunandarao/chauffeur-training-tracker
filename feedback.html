<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Training Feedback · ECO Mobility</title>
<link rel="icon" href="logo.webp" type="image/webp">
<style>
/* Phone-first single column: white header with the square logo, then one large card per step.
   Big 1-5 buttons so chauffeurs can answer with a thumb; logo red for actions. */
:root {
  --brand: #d6001c; --bg: #fff1f2; --surface: #ffffff; --surface-2: #fde7ea; --ink: #2a1215; --ink-2: #6d4a4f; --line: #f1cfd4;
  --good: #2f7d32; --good-soft: #dcefdc; --bad: #9f1d13; --bad-soft: #f6d6d2;
  --font: "Noto Sans", "Nirmala UI", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 17px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
header { background: var(--surface); border-bottom: 4px solid var(--brand); padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px; display: flex; align-items: center; gap: 12px; }
header img { height: 44px; width: auto; display: block; }
header h1 { margin: 0; font-size: 1.1rem; color: var(--brand); line-height: 1.2; }
header .sub { font-size: .82rem; color: var(--ink-2); }
main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(env(safe-area-inset-bottom, 0px) + 40px); display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card > * { min-width: 0; }
.session { font-size: .92rem; color: var(--ink-2); }
.session b { color: var(--ink); }
.langs { display: flex; flex-wrap: wrap; gap: 6px; }
.langs button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; cursor: pointer; font-size: .95rem; }
.langs button.on { background: var(--brand); color: #fff; border-color: var(--brand); }
h2 { margin: 0; font-size: 1.15rem; }
label { font-size: .9rem; font-weight: 600; color: var(--ink-2); margin-bottom: -6px; }
select { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: 1.05rem; background: var(--surface); }
input[type=search], input[type=text], input[type=tel] { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: 1.05rem; background: var(--surface); }
.names { display: grid; gap: 6px; max-height: 55vh; overflow-y: auto; overflow-x: hidden; }
.names button { display: flex; justify-content: space-between; align-items: center; gap: 8px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px; cursor: pointer; font-size: 1.02rem; }
.names button:disabled { opacity: .55; cursor: default; }
.names button span:first-child { min-width: 0; overflow-wrap: anywhere; }
.names button .tag { flex: none; font-size: .8rem; background: var(--good-soft); color: var(--good); border-radius: 99px; padding: 2px 9px; font-weight: 700; }
.btn { border: 0; border-radius: 12px; padding: 14px; font-size: 1.05rem; font-weight: 700; cursor: pointer; background: var(--brand); color: #fff; width: 100%; }
.btn:disabled { opacity: .5; }
.btn-ghost { background: transparent; color: var(--brand); border: 1px solid var(--line); }
.row { display: flex; gap: 10px; }
.row .btn { flex: 1; }
.q { display: grid; gap: 8px; padding: 12px 0; border-top: 1px solid var(--line); }
.q:first-of-type { border-top: 0; }
.q p { margin: 0; font-weight: 600; }
.q .num { color: var(--brand); margin-right: 4px; }
.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.scale button { height: 52px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 1.25rem; font-weight: 800; cursor: pointer; }
.scale button.on { background: var(--brand); color: #fff; border-color: var(--brand); }
.bi { display: block; font-size: .95em; font-weight: 500; color: var(--ink-2); }
.bi-inline { font-weight: 500; font-size: .85em; color: var(--ink-2); }
.langbig { display: grid; gap: 10px; }
.langbig button { border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 16px; font-size: 1.3rem; font-weight: 700; cursor: pointer; }
.langbig button:hover, .langbig button:focus-visible { border-color: var(--brand); color: var(--brand); }
.langbig.small { grid-template-columns: repeat(2, 1fr); }
.langbig.small button { font-size: 1.05rem; padding: 12px; }
.linkbtn { background: none; border: 0; color: var(--brand); font-weight: 600; text-decoration: underline; cursor: pointer; padding: 4px; justify-self: center; }
.hint { font-size: .85rem; color: var(--ink-2); margin: 0; }
.msg { border-radius: 10px; padding: 12px; font-size: .98rem; }
.msg.bad { background: var(--bad-soft); color: var(--bad); }
.msg.ok { background: var(--good-soft); color: var(--good); font-weight: 600; text-align: center; font-size: 1.1rem; padding: 20px; }
.who { font-weight: 700; }
.center { text-align: center; color: var(--ink-2); padding: 30px 0; }
</style>
</head>
<body>
<header><img src="logo.webp" alt="ECO Mobility"><div><h1 id="t-title">Training feedback</h1><div class="sub">ECO Mobility · CCR</div></div></header>
<main id="app"><div class="center">Loading…</div></main>
<script src="config.js?v=202610101000"></script>
<script src="fb-i18n.js?v=202610101000"></script>
<script src="feedback.js?v=202610101000"></script>
</body>
</html>
